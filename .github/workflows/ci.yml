name: CI

# Corre en cada push/PR hacia main, qa o dev para validar que el proyecto
# instala, importa y construye antes de fusionar.
on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa, dev]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    # Las credenciales NUNCA se suben al repo: se leen desde GitHub Secrets
    # (Settings > Secrets and variables > Actions) e inyectan como env vars.
    env:
      ENVIRONMENT: qa
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GITHUB_REPO: ${{ secrets.RAG_GITHUB_REPO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check . --exit-zero

      - name: Verificar que los módulos importan
        # Los clientes pesados (groq, sentence-transformers) se importan de
        # forma perezosa, así que estos imports no cargan torch ni la red.
        run: |
          python -c "from rag import config, costs, prompts, vectorstore, embeddings; print('rag utils OK')"
          python -c "from rag.retriever import Retriever; print('retriever OK')"
          python -c "from rag.generator import RAGGenerator; print('generator OK')"
          python -c "from rag.herramientas import HERRAMIENTAS; print('herramientas OK:', len(HERRAMIENTAS))"
          python -c "from rag.agente import AgenteAcademico; print('agente OK')"
          python -c "from rag.ingest import dividir_en_chunks; print('ingest OK')"

      - name: Build de la imagen Docker
        run: docker build -t rag-duoc-groq:ci .
